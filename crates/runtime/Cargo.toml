[package]
name = "peerspan-runtime"
description = "Peerspan's runtime: lightweight VMs for agent collaboration"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
libc = "0.2"
libloading = "0.8"
peerspan-runtime-protocol.workspace = true
rustix = { version = "1.1", features = ["event", "fs", "mount", "process", "thread", "time"] }
seccompiler = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tiny_http = "0.12"
ureq = "2"

[lints]
workspace = true
