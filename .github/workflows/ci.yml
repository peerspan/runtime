name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  vm:
    name: microVM checks (Linux x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev virtiofsd zstd cpio

      - name: Add musl target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Build libkrun from peerspan/libkrun
        run: |
          git clone --depth 1 --branch peerspan https://github.com/peerspan/libkrun "$RUNNER_TEMP/libkrun"
          make -C "$RUNNER_TEMP/libkrun" VHOST_USER=1
          echo "PEERSPAN_LIBKRUN=$RUNNER_TEMP/libkrun/target/release/libkrun.so.2.0.0" >> "$GITHUB_ENV"

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The runner's cloud kernel is not a dependable guest; use Ubuntu's generic one.
      - name: Build guest image
        run: |
          version=$(scripts/fetch-ubuntu-kernel.sh "$RUNNER_TEMP/kernel")
          GUEST_ROOT="$RUNNER_TEMP/kernel" GUEST_KERNEL_VERSION="$version" scripts/build-guest.sh "$RUNNER_TEMP/guest"
          echo "PEERSPAN_RUNTIME_GUEST=$RUNNER_TEMP/guest" >> "$GITHUB_ENV"

      # The runtime confines each VM, which needs root.
      - name: Run checks
        run: |
          cargo build --release -p peerspan-runtime
          sudo --preserve-env=PEERSPAN_LIBKRUN,PEERSPAN_RUNTIME_GUEST env "PATH=$PATH" "CARGO_HOME=$CARGO_HOME" "RUSTUP_HOME=$RUSTUP_HOME" scripts/check.sh
