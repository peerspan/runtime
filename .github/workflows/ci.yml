name: CI
# Kept light while the project takes shape: the cheap check runs on pushes, and the KVM job,
# which builds libkrun and boots VMs, only when started by hand (or locally: scripts/check.sh).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  vm:
    name: microVM checks (Linux x86_64)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev virtiofsd zstd cpio \
            flex bison bc libelf-dev nftables

      - name: Add musl target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Build libkrun from peerspan/libkrun
        run: |
          git clone --depth 1 --branch peerspan https://github.com/peerspan/libkrun "$RUNNER_TEMP/libkrun"
          make -C "$RUNNER_TEMP/libkrun" VHOST_USER=1 NET=1
          echo "PEERSPAN_LIBKRUN=$RUNNER_TEMP/libkrun/target/release/libkrun.so.2.0.0" >> "$GITHUB_ENV"

      - name: Build passt
        run: |
          scripts/build-passt.sh "$RUNNER_TEMP/passt"
          echo "PEERSPAN_PASST=$RUNNER_TEMP/passt/passt" >> "$GITHUB_ENV"

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build guest kernel and image
        run: |
          scripts/build-guest.sh "$RUNNER_TEMP/guest"
          echo "PEERSPAN_RUNTIME_GUEST=$RUNNER_TEMP/guest" >> "$GITHUB_ENV"

      # The runtime confines each VM, which needs root.
      - name: Run checks
        run: |
          cargo build --release -p peerspan-runtime
          sudo --preserve-env=PEERSPAN_LIBKRUN,PEERSPAN_RUNTIME_GUEST,PEERSPAN_PASST \
            PEERSPAN_RUNTIME_BIN="$PWD/target/release/peerspan-runtime" scripts/check.sh
